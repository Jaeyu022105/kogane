version: '3.8'

services:
  kogane:
    build:
      context: .
      dockerfile: Dockerfile
    image: kogane:latest
    container_name: kogane-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DEV_MODE=true
      # For SQLite persistence inside container:
      - DATABASE_URL=/app/data/dev.db
      # Optional LAN address for terminals across devices (e.g. http://192.168.1.50:3000)
      - NUXT_PUBLIC_SHARE_ORIGIN=
      # For Firebase production: set DEV_MODE=false and provide credentials
      # (the server switches to Firestore automatically when they are present):
      # - DEV_MODE=false
      # - FIREBASE_SERVICE_ACCOUNT_JSON=<raw or base64 service account JSON>
      # - SESSION_SECRET / ENCRYPTION_KEY (64+ char random strings)
    volumes:
      - kogane-data:/app/data

volumes:
  kogane-data:
    driver: local
