version: '3.8'

services:
  kogane:
    build:
      context: .
      dockerfile: Dockerfile
    image: kogane:latest
    container_name: kogane-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DEV_MODE=true
      # For SQLite persistence inside container:
      - DATABASE_URL=/app/data/dev.db
      # Optional LAN address for terminals across devices (e.g. http://192.168.1.50:3000)
      - NUXT_PUBLIC_SHARE_ORIGIN=
      # For Supabase production: set DEV_MODE=false and provide:
      # - DEV_MODE=false
      # - SUPABASE_URL=https://your-project.supabase.co
      # - SUPABASE_ANON_KEY=your-anon-key
      # - SUPABASE_SERVICE_KEY=your-service-role-key
    volumes:
      - kogane-data:/app/data

volumes:
  kogane-data:
    driver: local
