# Firebase App Hosting configuration (Cloud Run SSR + CDN)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Release channel: production builds without branch info default to "stable", which hides
  # preview-only features such as /pricing (see DEPLOYMENT.md section 10). Uncomment to force it.
  # - variable: KOGANE_RELEASE_CHANNEL
  #   value: stable
  #   availability:
  #     - BUILD
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: DEV_MODE
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: DB_PROVIDER
    value: firebase
    availability:
      - BUILD
      - RUNTIME
  - variable: COOKIE_SECURE
    value: "true"
    availability:
      - RUNTIME
  # Google's load balancer appends "<visitor-ip>, <load-balancer-ip>" to X-Forwarded-For,
  # so the visitor is 2 entries from the right (used for login rate limits).
  - variable: TRUST_PROXY
    value: "2"
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
