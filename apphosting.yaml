# Firebase App Hosting configuration (Cloud Run SSR + CDN)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: DEV_MODE
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: DB_PROVIDER
    value: firebase
    availability:
      - BUILD
      - RUNTIME
  - variable: COOKIE_SECURE
    value: "true"
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
